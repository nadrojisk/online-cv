        - Cyber Fire Puzzles — Co-hosted with Auburn University and Los Alamos National Laboratory Security Sciences Institute (45 participants)
        - AUCTF20 — Co-hosted AUEHC's first public CTF (81 challenges, ~3,000 participants); created reverse engineering and binary exploitation challenges; secured $300 prizes for each of the top 3 students

