      time: August 2018 - May 2021
      company: Ethical Hacking Club — Auburn University
      details: |
        - Participated in multiple CTF competitions run by various companies and universities
        - Taught lectures on binary reverse engineering and binary exploitation
        - Invited by Auburn University faculty to deliver guest lectures on reverse engineering techniques to undergraduate and graduate students
        - AUCTF19 — Co-hosted AUEHC's first private CTF (57 challenges, 20 participants); created challenges across cryptography, forensics, password cracking, reverse engineering, and binary exploitation; secured funding for top 5 students to attend DEFCON 27
