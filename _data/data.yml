experiences:
  title: Experiences
  info:
    - role: Cyber Security Operations Center Incident Response Analyst
      time: August 2022 - Present
      company: Pacific Northwest National Laboratory (PNNL)
      details: |
        - Collaborated with a multidisciplinary team of cybersecurity professionals to protect and defend PNNL's enterprise networks, coordinating regularly with Networking IT, Client IT, Cloud IT, Risk Assessment, Policy, and User Outreach teams
        - Triaged and investigated hundreds of alerts monthly within the cybersecurity incident queue, conducting thorough analysis of potential policy violations and security threats across a complex research network environment
        - Served as the subject matter expert for malware incidents within the Cyber Security Operations Center (CSOC), providing guidance on escalated threats and establishing analysis standards for the team
        - Conducted in-depth malware analysis of APT-level threats, including multi-layer deobfuscation, unpacking, and decompiler-assisted code reconstruction (Binary Ninja, IDA, Ghidra) to map TTPs to MITRE ATT&CK and extract indicators of compromise
        - Deployed and administered Assembly Line and CAPE sandbox environments to support automated malware triage and dynamic analysis at scale
        - Developed Binary Refinery pipelines to automate IOC extraction from malicious artifacts, accelerating indicator production and triage workflows
        - Developed and delivered Malware Analysis and Reverse Engineering training to the PNNL Cybersecurity Operations Center, improving team capability and reducing escalation time for complex threats
        - Mentored peers across the lab on malware analysis techniques, tooling, and investigative workflows
        - Authored malware intelligence reports disseminated across DOE national laboratories; EtherHiding/ClickFix (2025) comprised four sections — deep-dive stealer analysis, ClickFix lure analysis, EtherHiding infrastructure analysis, and enterprise threat hunting guidance; Nitrogen (2023) detailed installation vectors, persistence mechanisms, C2 behavior, and defensive recommendations
        - Presented original malware research at MTEM 2026, sharing findings on EtherHiding and ClickFix with the broader US government security community
        - Conducted active and passive threat hunts across enterprise endpoints and cloud environments using Microsoft Sentinel, Defender XDR, and Splunk to identify adversary activity and surface intrusions before impact
        - Authored and tuned host-based and network-based detection rules in Microsoft Sentinel and Defender XDR; wrote Splunk SPL and KQL queries to identify suspicious activity patterns at enterprise scale
        - Contributed to the development of PNNL CSOC's first React-based dashboard within Splunk, centralizing disparate logging sources and enabling enterprise-wide IOC searches across Splunk (SPL), Microsoft Sentinel Log Analytics (KQL), and Microsoft Defender Advanced Hunting (KQL)
        - Engineered a Splunk dashboard for phishing investigations, consolidating over 30 panels from disparate logging sources into a single interface, significantly reducing mean time to investigate phishing incidents
        - Engineered a Splunk dashboard for malicious file investigations, aggregating endpoint and threat intelligence data via SPL and Microsoft Defender Advanced Hunting (KQL) into a unified interface to accelerate malware triage and case analysis
        - Developed and maintained Microsoft Defender Advanced Hunting queries and reusable KQL utility functions leveraged across the CSOC team
        - Migrated CSOC Cortex (StrangeBee) responders from legacy scripts to containerized Docker images, improving portability, version control, and deployment consistency
        - Designed and maintained CI/CD pipelines to automate testing and deployment of CSOC tooling and detection content, reducing manual overhead and enforcing code quality standards
        - Led the design, development, and ongoing management of the CSOC's first AI-powered application — a full-stack Next.js frontend providing an AI chat interface backed by a FastAPI service for querying case information, playbooks, and internal code repositories
        - Deployed and managed the application entirely via Terraform on Azure Container Apps, establishing the CSOC's first cloud-native infrastructure-as-code deployment pattern

    - role: Incident Response Analyst
      time: June 2021 - December 2021
      company: Sandia National Laboratory
      details: |
        - Collaborated with a team of cybersecurity professionals to protect and defend Sandia's enterprise networks
        - Triaged and investigated alerts within the cybersecurity incident queue, assessing scope and severity of potential threats
        - Conducted in-depth analysis of APT-level malware samples to characterize attacker behavior and support incident response
        - Authored a technical report on POISONPLUG detailing installation vectors, persistence mechanisms, and operational capabilities
        - Developed detection signatures to enhance Sandia's threat detection capabilities and reduce dwell time

    - role: Graduate Research Assistant
      time: August 2020 - May 2021
      company: Auburn University
      details: |
        - Continued vehicle CAN bus analytics research in collaboration with Oak Ridge National Laboratory, focusing on optimizing the ML pipeline for deployment on resource-constrained devices such as Raspberry Pi
        - Investigated applicability of CAN signal reverse engineering techniques to non-automotive embedded systems
        - Maintained and extended the research codebase with a focus on portability and low-power device compatibility

    - role: Graduate Intern
      time: June 2020 - August 2020
      company: Los Alamos National Laboratory
      details: |
        - Completed coursework in malware analysis covering static and dynamic analysis, Windows fundamentals, common persistence mechanisms, x86 Assembly, anti-reverse engineering techniques, and malicious Office documents, PDFs, and JavaScript
        - Completed coursework in memory forensics for Windows systems, using Volatility and the Pmem suite to analyze memory artifacts
        - Completed coursework in network archaeology, learning techniques to decode custom protocols and recognize encrypted traffic from PCAP analysis
        - Participated in a simulated incident response exercise, analyzing PCAPs, disk images, memory dumps, and malicious binaries to reconstruct attacker activity; presented findings and recommendations to a simulated executive audience
        - Reverse engineered malware samples and extracted forensic artifacts to support compromise assessment
        - Decoded a custom C2 protocol embedded in a malicious sample, characterizing its capabilities and communication patterns

    - role: Intern and Graduate Research Assistant
      time: May 2019 - May 2020
      company: Oak Ridge National Laboratory
      details: |
        - Developed a supervised machine learning pipeline to automate reverse engineering of Controller Area Network (CAN) signals across vehicle makes and models, achieving an F1 score of 0.92
        - Extended the framework with heuristic-based signal classification to categorize signal types without ground-truth labels
        - Applied test-driven development practices throughout, ensuring correctness and maintainability of the research codebase
        - Presented research progress at the 2019 Summer Student Convivium

    - role: Undergraduate Researcher
      time: January 2018 - May 2019
      company: Auburn University
      details: |
        - Conducted OSINT research on integrated missile defense systems and the military's Blue Force Tracking System under contract with the US Army through Auburn's Cyber Research Center
        - Investigated potential attack surfaces and contributed to classified threat assessments; project details are For Official Use Only
        - Developed research skills including literature review, structured analysis, and technical reporting in a formal academic research environment

    - role: Software Engineering Co-Op
      time: August 2016 - December 2016, August 2017 - December 2017
      company: Rheem Manufacturing Co.
      details: |
        - Developed software features for Rheem's internal quality division web application (Reliance), contributing across two co-op terms
        - Built a Python-based supplier metrics reporting module that automated previously manual Excel workflows, reducing report generation time by 78% and enabling automated supplier notifications for unsatisfactory performance
        - Optimized an existing monthly metrics calculation program, reducing runtime from minutes or hours to seconds
        - Assumed sole ownership of a critical PPAP workflow application mid-project following an unplanned team departure, delivering a full revamp and migrating thousands of legacy PPAP records to the new system
        - Provided help desk support for employee account and application issues across both terms

